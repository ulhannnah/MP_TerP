name: C 모듈 호스트 단위 테스트
'on':
  push:
    branches: [jun_GPT, 'final/radar-system-20261126']
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/host-tests.yml'
  workflow_dispatch:
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 컴파일 도구 확인
        run: gcc --version
      - name: 타이머 모듈
        run: bash tests/run_host_tests.sh
      - name: 스텝 모터 컨트롤러
        run: bash tests/run_stepper_tests.sh
      - name: 서보 PWM
        run: bash tests/run_servo_tests.sh
      - name: 레이더 알고리즘
        run: bash tests/run_pipeline_tests.sh
      - name: 최종 App 호스트 통합 테스트
        run: bash tests/run_integration_tests.sh
      - name: Stage 5 프로파일 및 좌표계 테스트
        run: bash tests/run_profile_tests.sh
      - name: HD44780 비차단 LCD 큐/타이밍 테스트
        run: bash tests/run_lcd_async_tests.sh
      - name: 최종 실행 모드 및 테스트 모드 분기 확인
        run: bash tests/run_final_entry_tests.sh
      - name: 최종 레이더 자동 스캔·검출·조준 가상 통합
        run: bash tests/run_final_runtime_tests.sh
